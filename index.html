<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotaiLabs - Calculadora Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --deep-bg: #020b14;
            --panel-bg: rgba(6, 22, 40, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--deep-bg);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Rajdhani', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 450px; padding: 20px; }

        .calculator-card {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .subtitle { color: #a0c4ff; margin-bottom: 25px; letter-spacing: 1px; }

        .input-group { margin-bottom: 20px; text-align: left; }

        label {
            display: block;
            color: var(--neon-blue);
            margin-bottom: 5px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #335c6e;
            color: white;
            padding: 15px;
            font-size: 1.3rem;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        #tokenPrice { color: #00f3ff; font-weight: bold; }

        #tokenPrice.placeholder-error {
            font-style: italic;
            color: #aaa;
            font-weight: normal;
        }

        .results {
            margin-top: 25px;
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            padding-top: 20px;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }
        
        #resBRL { color: #00f3ff; text-shadow: 0 0 8px var(--neon-blue); }

        .loading-text { font-size: 0.9rem; color: #aaa; margin-top: 10px; margin-bottom: 20px;}

        /* --- ESTILO DOS ÍCONES SOCIAIS --- */
        .social-footer {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 243, 255, 0.1);
        }

        .social-link svg {
            width: 28px;
            height: 28px;
            fill: rgba(0, 243, 255, 0.7);
            transition: all 0.3s ease;
        }

        .social-link:hover svg {
            fill: var(--neon-blue);
            filter: drop-shadow(0 0 8px var(--neon-blue));
            transform: scale(1.15);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="calculator-card">
        <h1>KotaiLabs</h1>
        <p class="subtitle">Calculadora em Tempo Real</p>

        <div class="input-group">
            <label>PREÇO DO TOKEN (USD)</label>
            <input type="text" id="tokenPrice" value="" step="0.0001" inputmode="decimal">
        </div>

        <div class="input-group">
            <label>QUANTIDADE DE TOKENS</label>
            <input type="text" id="tokenAmount" placeholder="0" inputmode="numeric">
        </div>

        <div class="results">
            <div class="result-item">
                <span>Total em USD:</span>
                <span class="value" id="resUSD">$ 0.00</span>
            </div>
            <div class="result-item">
                <span>Total em BRL:</span>
                <span class="value" id="resBRL">R$ 0.00</span>
            </div>
        </div>

        <p class="loading-text" id="statusMsg">Carregando cotação e preço do token...</p>

        <div class="social-footer">
            <a href="https://youtube.com/@kotailabs" target="_blank" class="social-link" title="YouTube">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </a>

            <a href="https://www.instagram.com/kotailabsyt" target="_blank" class="social-link" title="Instagram">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
            </a>
        </div>
    </div>
</div>

<script>
    let dollarRate = 0;
    const priceInput = document.getElementById('tokenPrice');
    const amountInput = document.getElementById('tokenAmount');
    const statusMsg = document.getElementById('statusMsg');

    window.onload = async function() {
        // 1. Busca cotação do dólar
        try {
            const response = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
            const data = await response.json();
            dollarRate = parseFloat(data.USDBRL.bid);
            statusMsg.innerText = `Cotação: 1 USD = R$ ${dollarRate.toFixed(2)}`;
            statusMsg.style.color = "#00f3ff";
        } catch (error) {
            statusMsg.innerText = "Erro na cotação. Usando base R$ 5.80";
            dollarRate = 5.80;
        }

        // 2. Busca preço atual do token Kotai (CoinGecko)
        try {
            const tokenRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=kotai-2&vs_currencies=usd');
            const tokenData = await tokenRes.json();

            if (tokenData && tokenData['kotai-2'] && tokenData['kotai-2'].usd) {
                const price = tokenData['kotai-2'].usd;
                priceInput.value = price;
                priceInput.classList.remove('placeholder-error');
                priceInput.style.fontStyle = 'normal';
                priceInput.style.color = '#00f3ff';
                priceInput.style.fontWeight = 'bold';
            } else {
                throw new Error('Preço não encontrado');
            }
        } catch (error) {
            priceInput.value = 'Digite o preço atual';
            priceInput.classList.add('placeholder-error');
            priceInput.style.fontStyle = 'italic';
            priceInput.style.color = '#aaa';
            priceInput.style.fontWeight = 'normal';
        }

        calculate();
    };

    // Quando o usuário começar a digitar no preço, remove o estilo de erro
    priceInput.addEventListener('focus', function() {
        if (priceInput.value === 'Digite o preço atual') {
            priceInput.value = '';
            priceInput.classList.remove('placeholder-error');
            priceInput.style.fontStyle = 'normal';
            priceInput.style.color = '#00f3ff';
            priceInput.style.fontWeight = 'bold';
        }
    });

    priceInput.addEventListener('input', calculate);
    
    amountInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, "");
        if (value === "") {
            e.target.value = "";
            calculate();
            return;
        }
        e.target.value = new Intl.NumberFormat('pt-BR').format(value);
        calculate();
    });

    function calculate() {
        let priceStr = priceInput.value.replace(',', '.');
        // Se ainda estiver com o texto de erro, considera inválido
        if (priceStr === 'Digite o preço atual') {
            document.getElementById('resUSD').innerText = "$ 0.00";
            document.getElementById('resBRL').innerText = "R$ 0.00";
            return;
        }

        const price = parseFloat(priceStr);
        const rawAmountString = amountInput.value.replace(/\./g, "");
        const amount = parseFloat(rawAmountString);

        if (isNaN(price) || isNaN(amount)) {
            document.getElementById('resUSD').innerText = "$ 0.00";
            document.getElementById('resBRL').innerText = "R$ 0.00";
            return;
        }

        const totalUSD = price * amount;
        const totalBRL = totalUSD * dollarRate;

        document.getElementById('resUSD').innerText = totalUSD.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        document.getElementById('resBRL').innerText = totalBRL.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }
</script>

</body>
</html>
